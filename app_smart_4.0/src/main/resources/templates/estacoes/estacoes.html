<!doctype html>
<!--
  estacoes.html
  =============================================================
  Status ao vivo das 4 estações da bancada, lido do CLP via SSE
  (evento `estacao-status`). Consumidor SSE puro — NÃO acessa o
  banco. Cada card é hidratado/atualizado por static/js/pages/estacoes.js.

  Card id = frontKey da estação (estoque/producao/montagem/expedicao),
  igual ao campo `estacao` do evento e ao bancadaStatus.js#ESTACOES.

  Estado inicial = "Sem leitura"; vira ao vivo quando o 1º evento chega
  (estações conectadas na home; replay-on-connect hidrata no load).
  =============================================================
-->
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Estações — Smart 4.0</title>
    <div th:replace="~{fragments/smart40Fragments :: headDeps}"></div>
    <link rel="stylesheet" th:href="@{/css/estacoes.css}" />
  </head>

  <body>
    <!-- Navbar — activePage='estacoes' marca o link ativo -->
    <div th:replace="~{fragments/smart40Fragments :: navbar('estacoes')}"></div>

    <main class="estacoes">
      <header class="estacoes__header">
        <h1 class="estacoes__titulo">
          <i class="fa-solid fa-industry"></i> Estações
        </h1>
        <p class="estacoes__sub">
          Status ao vivo lido do CLP via SSE. Conecte uma estação na tela inicial para vê-la aqui.
        </p>
      </header>

      <section class="estacoes__grid">

        <!-- ESTOQUE -->
        <article class="estacao-card" id="estoque" data-lendo="0">
          <div class="estacao-card__top">
            <i class="fa-solid fa-boxes-stacked estacao-card__icone"></i>
            <h2 class="estacao-card__nome">Estoque</h2>
          </div>
          <span class="estacao-card__badge badge badge--dim estado">Sem leitura</span>
          <div class="estacao-card__linha">
            <span class="estacao-card__rotulo">Operação</span>
            <span class="estacao-card__func func">—</span>
          </div>
        </article>

        <!-- PROCESSO (frontKey = producao) -->
        <article class="estacao-card" id="producao" data-lendo="0">
          <div class="estacao-card__top">
            <i class="fa-solid fa-gears estacao-card__icone"></i>
            <h2 class="estacao-card__nome">Processo</h2>
          </div>
          <span class="estacao-card__badge badge badge--dim estado">Sem leitura</span>
          <div class="estacao-card__linha">
            <span class="estacao-card__rotulo">Operação</span>
            <span class="estacao-card__func func">—</span>
          </div>
        </article>

        <!-- MONTAGEM -->
        <article class="estacao-card" id="montagem" data-lendo="0">
          <div class="estacao-card__top">
            <i class="fa-solid fa-screwdriver-wrench estacao-card__icone"></i>
            <h2 class="estacao-card__nome">Montagem</h2>
          </div>
          <span class="estacao-card__badge badge badge--dim estado">Sem leitura</span>
          <div class="estacao-card__linha">
            <span class="estacao-card__rotulo">Operação</span>
            <span class="estacao-card__func func">—</span>
          </div>
        </article>

        <!-- EXPEDIÇÃO -->
        <article class="estacao-card" id="expedicao" data-lendo="0">
          <div class="estacao-card__top">
            <i class="fa-solid fa-truck-ramp-box estacao-card__icone"></i>
            <h2 class="estacao-card__nome">Expedição</h2>
          </div>
          <span class="estacao-card__badge badge badge--dim estado">Sem leitura</span>
          <div class="estacao-card__linha">
            <span class="estacao-card__rotulo">Operação</span>
            <span class="estacao-card__func func">—</span>
          </div>
        </article>

      </section>
    </main>

    <script type="module" th:src="@{/js/pages/estacoes.js}"></script>
  </body>
</html>
