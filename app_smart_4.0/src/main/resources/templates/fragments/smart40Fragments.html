<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Fragments — Smart 4.0</title>
</head>
<body>

  <!-- ================================================================
       FRAGMENT: headDeps
       Inclua no <head> de todas as páginas do novo design system.
       ================================================================ -->
  <th:block th:fragment="headDeps">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Base CSS (reset + tokens + navbar + cards) -->
    <link rel="stylesheet" th:href="@{/css/base.css}" />

    <!-- Favicon -->
    <link rel="icon" th:href="@{/images/Smart_4.0.png}" type="image/png" />
  </th:block>


  <!-- ================================================================
       FRAGMENT: navbar(subtitle, backUrl)
       Barra de navegação superior compartilhada por todas as telas.
       Parâmetros:
         subtitle — texto secundário abaixo do nome Smart 4.0
         backUrl  — URL do botão voltar (null para ocultar)
  ================================================================ -->
  <nav class="navbar" th:fragment="navbar(subtitle, backUrl)">

    <!-- Marca -->
    <a th:href="@{/general}" class="navbar__brand">
      <img th:src="@{/images/Smart_4.0.png}" alt="Smart 4.0" class="navbar__logo" />
      <div>
        <div>Smart 4.0</div>
        <div class="navbar__subtitle" th:text="${subtitle}">Módulo</div>
      </div>
    </a>

    <!-- Ações -->
    <div class="navbar__actions">

      <!-- Botão voltar (opcional) -->
      <a th:if="${backUrl != null}" th:href="${backUrl}">
        <button type="button" class="nav-btn" title="Voltar">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
      </a>

      <!-- Botão refresh -->
      <button type="button" class="nav-btn nav-btn--refresh" title="Atualizar página"
              onclick="location.reload()">
        <i class="fa-solid fa-rotate-right"></i>
      </button>

      <!-- Botão fechar janela -->
      <button type="button" class="nav-btn nav-btn--danger" title="Fechar"
              onclick="window.close()">
        <i class="fa-solid fa-power-off"></i>
      </button>

    </div>
  </nav>


  <!-- ================================================================
       FRAGMENT: scriptDeps
       Scripts comuns. Coloque antes do </body> em todas as páginas.
  ================================================================ -->
  <th:block th:fragment="scriptDeps">
    <script th:src="@{/javascript/smart40-utils.js}"></script>
  </th:block>

</body>
</html>
