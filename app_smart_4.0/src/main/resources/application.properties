spring.application.name=app_smart_4.0

server.port=8088
spring.datasource.url=jdbc:mysql://localhost:3306/DB_SMART_4_0
spring.datasource.username=root
spring.datasource.password=senai
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- SSE / leitura read-only dos CLPs ---
# IP por estacao (defaults de boot; alteravel em runtime via PUT /api/clp/ips/{estacao})
clp.ip.estoque=10.74.241.10
clp.ip.processo=10.74.241.20
clp.ip.montagem=10.74.241.30
clp.ip.expedicao=10.74.241.40
# Intervalos de captura (ms)
clp.poll.interval=2000
clp.grid.interval=2000
# Intervalo do processamento automatico (handshake de escrita) — roda por padrao enquanto houver
# cliente SSE conectado; nao depende de botao no front
clp.processar.interval=300
# Timeout do emitter SSE (ms); o EventSource reconecta sozinho ao expirar
clp.sse.timeout=3600000
# Threads do scheduler: 1 por produtor para que uma leitura lenta nao bloqueie as demais
spring.task.scheduling.pool.size=8

# Logs da comunicacao com o CLP (camada anterior ao SSE):
#   INFO  = transicoes de status publicadas (timeline limpa)
#   DEBUG = cada leitura: bytes brutos do bloco + flags derivadas + estado/funcionamento
logging.level.com.tecdes.smart.app_smart_40.service.sse.producer=DEBUG



