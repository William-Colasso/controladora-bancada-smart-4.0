spring.application.name=app_smart_4.0

# Ambientes: importa um .env (formato properties) da raiz do modulo, se existir.
# Variaveis de ambiente do SO tambem sobrescrevem os defaults abaixo (ordem padrao do Spring).
# Modelo em .env; o .env real e ignorado pelo git.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8088}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DB_SMART_4_0}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:senai}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- SSE / leitura read-only dos CLPs ---
# IP por estacao (defaults de boot; alteravel em runtime via PUT /api/clp/ips/{estacao})
clp.ip.estoque=10.74.241.10
clp.ip.processo=10.74.241.20
clp.ip.montagem=10.74.241.30
clp.ip.expedicao=10.74.241.40
# Intervalo do processamento automatico (handshake de escrita) — roda por padrao enquanto houver
# cliente SSE conectado; nao depende de botao no front. Cada passada notifica o
# ClpEventoCoordinator, que publica eventos SSE apenas quando as variaveis mudam.
clp.processar.interval=300
# Watchdog do coordenador: sem leitura ha >1,5s, estacoes viram "off" (on-change)
clp.watchdog.interval=1000
# Timeout do emitter SSE (ms); o EventSource reconecta sozinho ao expirar
clp.sse.timeout=3600000
# Threads do scheduler: 1 por produtor para que uma leitura lenta nao bloqueie as demais
spring.task.scheduling.pool.size=8


delay.order.queue=1000

# Controladora de tampa (ESP32) — presente so em algumas bancadas; alteravel em runtime
# via PUT /api/config/tampa (pagina /configuracao)
tampa.habilitada=true
tampa.ip=10.74.241.245

# Logs da comunicacao com o CLP (camada anterior ao SSE):
#   INFO  = transicoes de status publicadas (timeline limpa)
#   DEBUG = cada leitura: bytes brutos do bloco + flags derivadas + estado/funcionamento
logging.level.root=warn


