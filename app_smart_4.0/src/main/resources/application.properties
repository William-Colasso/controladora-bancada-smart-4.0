# ============================================================================
# Application Configuration - Smart 4.0
# ============================================================================

# --- Informações Básicas da Aplicação ---
spring.application.name=app_smart_4.0

# --- Configuração de Ambiente ---
# Importa variáveis do arquivo .env (formato properties) da raiz do módulo, se existir.
# Variáveis de ambiente do SO também sobrescrevem os defaults abaixo (ordem padrão do Spring).
# Modelo disponível em .env.example; o arquivo .env real é ignorado pelo git.
spring.config.import=optional:file:.env[.properties]


# ============================================================================
# SERVIDOR
# ============================================================================

server.port=${SERVER_PORT:8088}


# ============================================================================
# BANCO DE DADOS
# ============================================================================

# Configuração de conexão
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DB_SMART_4_0}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:senai}

# Configuração do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Pool de Conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000


# ============================================================================
# INTEGRAÇÃO COM CLPs (Controladores Lógicos Programáveis)
# ============================================================================

# --- Configuração de Endereços IP por Estação ---
# Defaults de inicialização; alteráveis em runtime via PUT /api/clp/ips/{estacao}
clp.ip.estoque=10.74.241.10
clp.ip.processo=10.74.241.20
clp.ip.montagem=10.74.241.30
clp.ip.expedicao=10.74.241.40

# --- Processamento Automático (Handshake de Escrita) ---
# Tick-base (ms): granularidade do scheduler. Deve ser <= o menor intervalo por estação.
clp.processar.base=100
# Intervalo de polling PADRÃO por estação (ms) — usado quando não há override abaixo.
# Roda enquanto houver cliente SSE conectado (ou pedido na fila); publica no SSE só quando muda.
# Alterável em runtime por estação via PUT /api/clp/polling/{estacao} (página /configuracao).
clp.processar.interval=300
# Override opcional por estação (ausente → cai no clp.processar.interval):
# clp.processar.interval.estoque=300
# clp.processar.interval.processo=300
# clp.processar.interval.montagem=300
# clp.processar.interval.expedicao=300

# --- Ping / Socket S7 (leituras fail-fast) ---
# Ping (probe TCP na porta 102) antes de comunicar: se a estação não responde no timeout, a passada é
# pulada (não trava) e o heartbeat não pulsa. connect/read-timeout limitam o socket S7 do pool de conexões
# (evitam travar ~20s numa estação inalcançável / travar a leitura numa estação que caiu).
clp.ping.timeout=500
clp.socket.connect-timeout=800
clp.socket.read-timeout=1500

# --- Watchdog do Coordenador ---
# Intervalo em ms para verificar saúde da conexão com CLPs.
# Se não houver leitura por mais de 1,5s, as estações mudam de status para "off" (on-change).
clp.watchdog.interval=1000

# --- Timeout do Emitter SSE ---
# Tempo em ms antes de encerrar a conexão SSE.
# O EventSource no cliente reconecta automaticamente ao expirar.
clp.sse.timeout=3600000

# --- Thread Pool do Scheduler ---
# Uma thread por produtor de CLP para evitar que uma leitura lenta bloqueie as demais.
# Total recomendado: número de estações + buffers extras (ex: 12 para 4 estações).
spring.task.scheduling.pool.size=12


# ============================================================================
# FILA DE PEDIDOS
# ============================================================================

# Intervalo em ms entre processamentos da fila de pedidos
delay.order.queue=1000


# ============================================================================
# CONTROLADORA DE TAMPA (ESP32)
# ============================================================================

# Presença e configuração da tampa automática (nem todas as bancadas possuem).
# Alterável em runtime via PUT /api/config/tampa (página /configuracao).
tampa.habilitada=true
tampa.ip=10.74.241.245


# ============================================================================
# LOGGING
# ============================================================================

# --- Nível Geral de Log ---
logging.level.root=warn

# --- Logs do Hibernate (ORM) ---
# DEBUG  = SQL gerado e executado
# TRACE  = Binding de parâmetros (valores reais das queries)
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# --- Logs de Comunicação com CLPs ---
# DEBUG      = Cada leitura: bytes brutos do bloco + flags derivadas + estado/funcionamento
# INFO       = Transições de status publicadas (timeline limpa)
# Descomente e configure conforme necessário para diagnóstico:
# logging.level.com.tecdes.smart.app_smart_40.service.clp=debug
# logging.level.com.tecdes.smart.app_smart_40.service.sse=debug
# logging.level.com.tecdes.smart.app_smart_40.controller=debug

# --- Logs de Configuração Spring ---
# Uncomment para diagnosticar injeção de dependências e auto-configuração:
# logging.level.org.springframework.context=debug
# logging.level.org.springframework.boot.autoconfigure=debug